<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bassoon">
  <g transform="rotate(18 32 32)" stroke="#2b2b2b" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- long joint -->
    <rect x="26" y="10" width="11" height="45" rx="3" fill="#b4613d"/>
    <!-- bell ring at the top -->
    <rect x="24.5" y="6" width="14" height="5" rx="2" fill="#f0d9b8"/>
    <!-- silver bands -->
    <rect x="26" y="19" width="11" height="3.4" fill="#c8ccd2"/>
    <rect x="26" y="36" width="11" height="3.4" fill="#c8ccd2"/>
    <rect x="26" y="51" width="11" height="4" rx="1.5" fill="#c8ccd2"/>
    <!-- keywork -->
    <g fill="none" stroke-width="1.3">
      <path d="M30 25.5h3.5M30 29h3.5M30 43h3.5M30 46.5h3.5"/>
    </g>
    <!-- bocal and reed -->
    <path d="M33 15c7-3 11 1 12 4" fill="none" stroke-width="1.9"/>
    <path d="M44 17.5l4.5-2.5" stroke-width="2.6" stroke="#f0d9b8"/>
  </g>
</svg>
