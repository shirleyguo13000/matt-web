<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bassoon">
  <g transform="rotate(-42 32 32)" stroke="#141414" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- body, tapering slightly toward the bell -->
    <path d="M25.5 12h13v40a3 3 0 0 1-3 3h-7a3 3 0 0 1-3-3z" fill="#b5502a"/>
    <!-- bell flare -->
    <path d="M26 12l1.5-6h9L38 12z" fill="#b5502a"/>
    <ellipse cx="31.8" cy="5.6" rx="5.4" ry="1.9" fill="#fff"/>
    <!-- joint bands and boot cap -->
    <rect x="25.5" y="24" width="13" height="4.2" fill="#fff"/>
    <rect x="25.5" y="40" width="13" height="4.2" fill="#fff"/>
    <path d="M25.5 49h13v3a3 3 0 0 1-3 3h-7a3 3 0 0 1-3-3z" fill="#fff"/>
    <!-- keywork -->
    <g fill="#fff" stroke-width="1.2">
      <circle cx="29.5" cy="18.5" r="1.5"/>
      <circle cx="34.5" cy="32.5" r="1.5"/>
      <circle cx="29.5" cy="36" r="1.5"/>
      <circle cx="34" cy="46.5" r="1.5"/>
    </g>
    <!-- bocal curving away, with the reed on the end -->
    <path d="M37.5 21c8-1.5 11 2.5 10.5 7.5" fill="none" stroke-width="1.9"/>
    <path d="M48 28.5l1.5 5" stroke="#fff" stroke-width="2.4"/>
  </g>
</svg>
