<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first: it holds 16/32/48 and is what Google probes at
         /favicon.ico. the 192px png is the size Google documents for
         search-result favicons (must be a multiple of 48). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Matthew So - bassoonist, oboist, pianist and educator based in New York. Recordings, upcoming concerts, and private lessons."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fetched at high priority but applied off the critical path:
         a plain stylesheet link here blocks first paint by ~1.8s -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@300;400;600&family=Cormorant+SC:wght@300;400;500&family=Mea+Culpa&family=Noto+Serif+Display:ital,wght@1,200&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@300;400;600&family=Cormorant+SC:wght@300;400;500&family=Mea+Culpa&family=Noto+Serif+Display:ital,wght@1,200&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@300;400;600&family=Cormorant+SC:wght@300;400;500&family=Mea+Culpa&family=Noto+Serif+Display:ital,wght@1,200&display=swap" /></noscript>
    <title>Matthew So</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
